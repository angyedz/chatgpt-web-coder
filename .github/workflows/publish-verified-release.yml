name: Publish verified Windows release

on:
  workflow_run:
    workflows: ["Windows CI and release"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified GitHub Release
    # Only first-party workflow runs with fully passing checks may publish.
    # No untrusted fork PR gets a release token or access to this job.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build from the successful workflow run
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify archive and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_SOURCE_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
          source_sha="$SOURCE_SHA"
          if [ "$RUN_EVENT" = "pull_request" ] && [[ "$PR_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            source_sha="$PR_SOURCE_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run"; exit 1; }
          [[ "$RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid run attempt"; exit 1; }
          case "$RUN_EVENT" in
            push|pull_request|workflow_dispatch) ;;
            *) echo "Unsupported workflow trigger: $RUN_EVENT"; exit 1 ;;
          esac

          version="$(unzip -p release/chatgpt-coder-windows.zip package.json | jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+([-.+][0-9A-Za-z.-]+)?$"))')"
          channel=preview
          tag="preview-${RUN_ID}-${RUN_ATTEMPT}"
          flags=(--prerelease --latest=false)
          if [ "$RUN_EVENT" != "pull_request" ] && [ "$RUN_BRANCH" = main ]; then
            channel=stable
            tag="build-${RUN_ID}-${RUN_ATTEMPT}"
            flags=(--latest=false)
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [ "$current_main" = "$source_sha" ]; then flags=(--latest); fi
          fi
          printf 'Автоматическая %s-сборка версии %s.\nВетка: %s\nКоммит: %s\nПроверенный CI run: %s.\n\n' "$channel" "$version" "$RUN_BRANCH" "$source_sha" "$RUN_ID" > release-notes.md
          printf '%s\n' '**Установка:** распакуйте `chatgpt-coder-windows.zip` и запустите `install.cmd`.' '**Из ZIP:** выберите файл командой `/update`, затем `/update apply`.' '' '`SHA256SUMS.txt` содержит SHA-256 проверенного архива.' >> release-notes.md
          if [ "$channel" = stable ]; then
            printf '%s\n' '' 'Для стабильных релизов доступно обновление через `/update latest`.' >> release-notes.md
          else
            printf '%s\n' '' 'Это предварительная сборка; `/update latest` её не устанавливает. Используйте ZIP вручную.' >> release-notes.md
          fi
          gh release create "$tag" release/chatgpt-coder-windows.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --title "chatgpt-coder ${version} · ${channel} · ${source_sha:0:7}" \
            --notes-file release-notes.md "${flags[@]}"
