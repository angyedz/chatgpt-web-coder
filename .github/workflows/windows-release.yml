name: Windows CI and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # For trusted in-repository PRs, build the exact head commit that is released.
          # Fork PRs continue to test GitHub's merge ref and cannot publish.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install chromium

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Read version
        id: metadata
        shell: powershell
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($package.version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($package.version)`n", (New-Object Text.UTF8Encoding $false))

      - name: Build Windows installer and update package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-update.ps1 -OutputPath 'dist\release\chatgpt-coder-windows.zip'

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist\release\chatgpt-coder-windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\release\SHA256SUMS.txt'), "$hash  chatgpt-coder-windows.zip`n", (New-Object Text.UTF8Encoding $false))

      - name: Save release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # Same-repo PRs can publish previews; fork PRs never get a write token.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
          source_sha="$GITHUB_SHA"
          source_ref="$GITHUB_REF_NAME"
          channel="preview"
          tag="preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_flags=(--prerelease --latest=false)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            source_sha="$PR_HEAD_SHA"
            source_ref="$GITHUB_HEAD_REF"
            tag="preview-pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            channel="stable"
            tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            release_flags=(--latest)
          fi
          printf 'Автоматическая %s-сборка версии %s.\nВетка: %s\nКоммит: %s\n\n' "$channel" "$VERSION" "$source_ref" "$source_sha" > release-notes.md
          cat >> release-notes.md <<'EOF'
          **Установка:** распакуйте `chatgpt-coder-windows.zip` и запустите `install.cmd`.
          **Обновление из ZIP:** выберите файл командой `/update`, затем выполните `/update apply` и перезапустите программу.

          `SHA256SUMS.txt` содержит SHA-256 архива. Для установки зависимостей требуется интернет.
          EOF
          if [ "$channel" = "stable" ]; then
            printf '%s\n' '' '**Автообновление:** выполните `/update latest` и затем `/update apply`.' >> release-notes.md
          else
            printf '%s\n' '' '**Предварительная сборка:** не включается в `/update latest`; устанавливайте ZIP вручную. Не рекомендуется вместо стабильной сборки без проверки.' >> release-notes.md
          fi
          gh release create "$tag" release/chatgpt-coder-windows.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --title "chatgpt-coder ${VERSION} · ${channel} · ${source_sha:0:7}" \
            --notes-file release-notes.md "${release_flags[@]}"
