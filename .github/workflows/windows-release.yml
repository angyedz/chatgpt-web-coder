name: Windows CI and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # For trusted in-repository PRs, build the exact head commit that is released.
          # Fork PRs continue to test GitHub's merge ref and cannot publish.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install chromium

      - name: Parse Windows build script
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/build-update.ps1).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Read version
        id: metadata
        shell: powershell
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($package.version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($package.version)`n", (New-Object Text.UTF8Encoding $false))

      - name: Build Windows installer and update package
        shell: powershell
        env:
          CHATGPT_CODER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-update.ps1 -OutputPath 'dist\release\chatgpt-coder-windows.zip'

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist\release\chatgpt-coder-windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\release\SHA256SUMS.txt'), "$hash  chatgpt-coder-windows.zip`n", (New-Object Text.UTF8Encoding $false))

      - name: Save release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
